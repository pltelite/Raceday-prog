version: '3.8'

services:
  raceday.api:
    image: raceday-api
    build:
      context: .
      dockerfile: RaceDay.API/Dockerfile
    ports:
      - "7123:80"

  raceday.web:
    image: raceday-web
    build:
      context: .
      dockerfile: RaceDay.Web/Dockerfile
    ports:
      - "5000:80"
    depends_on:
      - raceday.api